# Documentation maintenance configuration (shared flext-quality profile)

audit:
  include_patterns:
    - "*.md"
    - "*.mdx"
  exclude_patterns:
    - ".git/**"
    - "node_modules/**"
    - "__pycache__/**"
    - ".venv/**"
    - "docs/maintenance/**"
  thresholds:
    min_word_count: 50
    max_age_days: 30
    min_quality_score: 80
    min_completeness_score: 75

content:
  required_sections:
    - "Overview"
    - "Installation"
    - "Usage"
    - "API"
  prohibited_patterns:
    - "TODO"
    - "FIXME"
    - "HACK"

validation:
  timeout: 10
  retries: 2
  user_agent: "FLEXT-gRPC DocMaintainer/1.0"
  cache_ttl: 86400
  max_workers: 5
  skip_domains:
    - "localhost"
    - "127.0.0.1"
    - "example.com"
    - "*.local"
  skip_patterns:
    - "docs/maintenance/**"
    - "backups/**"

style:
  max_line_length: 88
  require_language_in_code_blocks: true
  consistent_list_markers: true
  heading_hierarchy: true
  no_trailing_spaces: true
  accessibility:
    require_alt_text: true
    descriptive_links: true

optimization:
  auto_fix: true
  create_backups: true
  max_line_length: 88
  add_toc_to_long_docs: true
  toc_min_headings: 4
  fix_common_typos: true
  enhance_code_blocks: true
  improve_formatting: true

sync:
  auto_commit: true
  commit_message_template: "docs: {operation} - {changes} changes"
  backup_before_changes: true
  validate_before_commit: true
  push_after_commit: false
  branch_prefix: "docs-maintenance"

git:
  remote_name: "origin"
  main_branch: "main"
  create_backup_branch: true

reporting:
  output_formats:
    - "markdown"
  include_charts: false
  metrics_history_days: 90
  dashboard_template: "markdown-only"
  thresholds:
    excellent_score: 90
    good_score: 80
    fair_score: 65

notifications:
  enabled: false
  notify_on_critical: true
  notify_on_score_changes: true
