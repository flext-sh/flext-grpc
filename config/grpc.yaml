# FLEXT gRPC business-rule SSOT.
# Values here are frozen at load time and exposed through `config.Grpc.*`.
Grpc:
  network:
    default_channel_ready_timeout: 5.0
    default_graceful_shutdown_timeout: 2.0
    default_host: "127.0.0.1"
    default_keepalive_time_ms: 30000
    default_keepalive_timeout_ms: 5000
    default_port: 50051
    default_timeout: 30.0
    host_pattern: "^[a-zA-Z0-9.-]+$"
    max_port: 65535
    min_port: 1
  performance:
    default_message_length: 4194304
    default_thread_pool_size: 50
    max_message_length: 104857600
    max_thread_pool_size: 200
    min_message_length: 1024
    min_thread_pool_size: 1
  service:
    default_max_concurrent_rpcs: 1000
    default_max_workers: 10
    max_workers: 100
    min_workers: 1
  streaming:
    bidirectional_queue_size: 1000
    client_buffer_threshold: 10
    default_buffer_size: 500
    default_max_concurrent_streams: 10
    max_buffer_size: 10000
    min_buffer_size: 10
    server_batch_size: 100
  connection_pool:
    default_pool_size: 20
