# Pre-commit configuration - FLEXT gRPC
# See https://pre-commit.com for more information

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.13
        exclude: ^.*_pb2\.py$|^.*_pb2_grpc\.py$|^generated/.*$

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^.*_pb2\.py$|^.*_pb2_grpc\.py$|^generated/.*$
      - id: ruff-format
        exclude: ^.*_pb2\.py$|^.*_pb2_grpc\.py$|^generated/.*$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        additional_dependencies:
          [
            types-python-dateutil,
            types-requests,
            types-setuptools,
            types-protobuf,
            pydantic,
            grpcio,
            grpcio-tools,
            grpcio-status,
            protobuf,
            google-api-core,
            googleapis-common-protos,
            structlog,
            prometheus_client,
            opentelemetry-api,
            tenacity,
            cryptography,
          ]
        args: [--strict, --ignore-missing-imports]
        exclude: ^.*_pb2\.py$|^.*_pb2_grpc\.py$|^generated/.*$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, src/]
        exclude: tests/|.*_pb2\.py$|.*_pb2_grpc\.py$|generated/

  - repo: https://github.com/python-poetry/poetry
    rev: 1.8.4
    hooks:
      - id: poetry-check
      - id: poetry-lock
        args: [--no-update]

  # Protocol Buffers validation
  - repo: local
    hooks:
      - id: protobuf-validate
        name: validate protobuf files
        entry: python -m grpc_tools.protoc
        language: system
        files: \.proto$
        args: [-I., --descriptor_set_out=/dev/null]
        pass_filenames: true
