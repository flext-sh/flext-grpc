[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "flext-grpc"
version = "0.2.0"
description = "FLEXT gRPC - Enterprise gRPC Services with High-Performance RPC"
authors = [{name = "FLEXT Team", email = "team@flext.sh"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["flext", "grpc", "rpc", "microservices", "protobuf", "enterprise"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "grpcio>=1.66.0",
    "grpcio-tools>=1.66.0",
    "grpcio-reflection>=1.66.0",
    "grpcio-health-checking>=1.66.0",
    "grpcio-status>=1.66.0",
    "protobuf>=5.28.0",
    "google-api-core>=2.22.0",
    "googleapis-common-protos>=1.66.0",
    "pydantic>=2.11.0",
    "structlog>=24.0.0",
    "prometheus_client>=0.21.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-instrumentation-grpc>=0.48b0",
    # "asyncio-compat>=0.3.0",            # Package not available
    "tenacity>=9.0.0",
    "cryptography>=42.0.0",
]

[project.scripts]
flext-grpc = "flext_grpc.cli:main"
flext-grpc-server = "flext_grpc.server:main"
flext-grpc-client = "flext_grpc.client:main"

[project.urls]
Homepage = "https://github.com/flext-sh/flext-grpc"
Repository = "https://github.com/flext-sh/flext-grpc"
Documentation = "https://github.com/flext-sh/flext-grpc/blob/main/README.md"
"Bug Tracker" = "https://github.com/flext-sh/flext-grpc/issues"
Changelog = "https://github.com/flext-sh/flext-grpc/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "flext_grpc", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-xdist = "^3.6.0"
pytest-mock = "^3.14.0"
pytest-timeout = "^2.3.0"
grpcio-testing = "^1.66.0"
ruff = "^0.8.4"
mypy = "^1.13.0"
black = "^24.10.0"
isort = "^5.13.0"
types-requests = "^2.32.0"
types-setuptools = "^75.6.0"
types-protobuf = "^5.28.0"
pre-commit = "^4.0.0"
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
ipython = "^8.29.0"

[tool.poetry.group.security.dependencies]
bandit = { extras = ["toml"], version = "^1.7.0" }
safety = "^3.2.0"

[tool.poetry.group.build.dependencies]
build = "^1.2.0"
twine = "^6.0.0"

[tool.poetry.group.test.dependencies]
pytest-benchmark = "^4.0.0"
faker = "^30.8.0"
factory-boy = "^3.3.0"
grpcio-tools = "^1.66.0"

[tool.poetry.group.load.dependencies]
locust = "^2.31.0"
# ghz = "^0.120.0"                        # Package not available in PyPI

[tool.ruff]
line-length = 88
target-version = "py313"
fix = true
exclude = [
    "__pycache__",
    ".venv",
    ".git",
    "build",
    "dist",
    "*_pb2.py",
    "*_pb2_grpc.py",
    "generated/",
    "proto/"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # MANDATORY: Only formatter conflicts that cannot be auto-fixed
    "COM812",  # trailing-comma-missing (handled by formatter)
    "ISC001",  # implicit-str-concat (conflicts with formatter)
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-docstring-summary-second-line (conflicts with D212)

    # FOCUS: Only critical errors for now - ignore non-critical temporarily
    "E501",    # line-too-long (formatting)
    "D100", "D101", "D102", "D103", "D105", "D107", "D205", "D401", "D417",  # docstring issues
    "ANN001", "ANN101", "ANN102", "ANN201", "ANN202", "ANN204", "ANN401", "ANN003", "ANN002",  # type annotations
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "C901",  # complexity
    "E402",    # import-not-at-top (legacy)
    "S110", "S112", "S105", "S106", "S108", "S314", "S603", "S607", "S101", "S102",  # security (non-critical)
    "ARG001", "ARG002", "ARG003", "ARG005",  # unused arguments
    "PTH108", "PTH110", "PTH116", "PTH117", "PTH118", "PTH120", "PTH123",  # pathlib
    "TRY002", "TRY003", "TRY004", "TRY300", "TRY301", "TRY401",  # try/except patterns
    "FBT001", "FBT002", "FBT003",  # boolean traps
    "DTZ001", "DTZ005", "DTZ006", "DTZ007",  # datetime
    "G004", "G201",  # logging
    "N806", "N811",  # naming
    "B007", "B018", "B019", "B023", "B904",  # bugbear non-critical
    "SIM102", "SIM105", "SIM113", "SIM117",  # simplify
    "RUF001", "RUF002", "RUF005",  # ruff specific
    "UP035",  # typing upgrades
    "ERA001",  # commented code
    "TD002", "TD003",  # todos
    "FIX002",  # fixme
    "PLW0602", "PLW0603", "PLW2901",  # pylint warnings
    "PLC0415",  # pylint conventions
    "PLE0605",  # pylint errors non-critical
    "PERF102", "PERF203", "PERF402",  # performance
    "A002", "A004",  # builtins
    "PT011", "PT012", "PT017",  # pytest
    "PD008",  # pandas
    "INP001",  # namespace packages
    "PLR0124", "PLR2004",  # magic values
    "PYI056",  # pyi
    "EXE001",  # executable
    "BLE001",  # blind except (temporarily)
    "SLF001",  # private access (temporarily)
    "E722", "E741",  # bare except and ambiguous names
    "T201",  # print statements (temporarily)
    "PLW2901",  # redefined loop variable (temporarily)
    "D401",  # docstring imperative mood (temporarily)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "D", "ANN"]
"examples/*" = ["T201", "D", "ERA001"]
"__init__.py" = ["D104"]
"conftest.py" = ["D"]
"*_pb2.py" = ["ALL"]  # Generated files
"*_pb2_grpc.py" = ["ALL"]  # Generated files
"generated/*" = ["ALL"]  # Generated files

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.black]
line-length = 88
target-version = ["py313"]
exclude = "(.*_pb2\\.py|.*_pb2_grpc\\.py|generated/.*)"

[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["*_pb2.py", "*_pb2_grpc.py", "generated/*"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [".*_pb2\\.py$", ".*_pb2_grpc\\.py$", "generated/.*"]

[[tool.mypy.overrides]]
module = ["grpc.*", "grpcio.*", "google.*", "protobuf.*", "opentelemetry.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-fail-under=85",
    "--junitxml=reports/pytest.xml",
    "--maxfail=10",
    "--timeout=30",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "grpc: marks tests as gRPC tests",
    "server: marks tests as server tests",
    "client: marks tests as client tests",
    "streaming: marks tests as streaming tests",
    "load: marks tests as load tests",
    "performance: marks tests as performance tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::grpc._channel._InactiveRpcError",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/*_test.py",
    "*/conftest.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*",
    "*/.eggs/*",
    "*_pb2.py",
    "*_pb2_grpc.py",
    "generated/*",
]

[tool.coverage.report]
skip_empty = true
skip_covered = false
show_missing = true
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "TYPE_CHECKING",
]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "build", "dist", "generated"]
skips = ["B101", "B601"]

[tool.bandit.assert_used]
skips = ["*/tests/*", "*/test_*.py"]
