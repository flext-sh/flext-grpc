[build-system]
build-backend = "poetry.core.masonry.api"
requires = [
  "poetry-core>=2.0",
]

[project]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
  "Development Status :: 5 - Production/Stable",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "grpcio (>=1.76.0,<2.0.0)",
  "grpcio-tools (>=1.75.1)",
  "prometheus-client (>=0.23.0)",
  "protobuf (>=6.33.5)",
  "psutil (>=5.9.0)",
  "pydantic (>=2.12.3)",
  "pydantic-settings (>=2.11.0)",
  "sqlalchemy (>=2.0.44)",
  "pydantic-core (>=2.41.4)",
]
description = "FLEXT gRPC - High-Performance gRPC Services"
keywords = [
  "enterprise",
  "flext",
  "grpc",
  "microservices",
  "protobuf",
  "typed",
]
name = "flext-grpc"
readme = "README.md"
requires-python = ">=3.13,<3.14"
version = "0.12.0-dev"
license = "MIT"

[[project.authors]]
email = "team@flext.sh"
name = "FLEXT Team"

[[project.maintainers]]
email = "team@flext.sh"
name = "FLEXT Team"
[project.urls]
Documentation = "https://github.com/flext-sh/flext/blob/main/README.md"
Homepage = "https://github.com/flext-sh/flext"
Repository = "https://github.com/flext-sh/flext"

[project.optional-dependencies]
dev = [
  "autoflake>=2.3.1",
  "black>=25.1.0",
  "codespell>=2.3.0",
  "deptry>=0.23.0",
  "isort>=6.0.1",
  "pre-commit>=4.0.1",
  "pylint>=3.3.0",
  "pyupgrade>=3.19.0",
  "radon>=6.0.1",
  "ruff>=0.12.3",
  "vulture>=2.13",
]
security = [
  "bandit>=1.8.0",
  "pip-audit>=2.7.3",
]
test = [
]
typings = [
  "django-stubs>=5.2.2",
  "types-ldap3>=2.9.13.20250622",
  "types-protobuf>=6.30.2.20250703",
  "types-psutil>=7.0.0",
  "types-psycopg2>=2.9.21.20250718",
  "types-python-dateutil>=2.9.0",
  "types-pyyaml>=6.0.12",
  "types-redis>=4.6.0",
  "types-requests>=2.32.4",
  "types-setuptools>=80.9.0",
  "types-toml>=0.10.8.20240310",
]

[tool.poetry]
[[tool.poetry.packages]]
from = "src"
include = "flext_grpc"

[tool.deptry]
known_first_party = [
  "flext_grpc",
  "flext_core",
  "flext_observability",
]
pep621_dev_dependency_groups = [
  "dev",
  "test",
  "typings",
  "security",
]

[tool.deptry.per_rule_ignores]
DEP002 = [
  # CLI tools (invoked from command line, not imported)
  "autoflake",
  "bandit",
  "black",
  "codespell",
  "deptry",
  "isort",
  "pip-audit",
  "pre-commit",
  "pylint",
  "pyupgrade",
  "radon",
  "ruff",
  "vulture",
  # Type stubs
  "django-stubs",
  "types-ldap3",
  "types-protobuf",
  "types-psutil",
  "types-psycopg2",
  "types-python-dateutil",
  "types-pyyaml",
  "types-redis",
  "types-requests",
  "types-setuptools",
  "types-toml",
  # Runtime deps used indirectly (via grpcio, pydantic)
  "grpcio",
  "grpcio-tools",
  "protobuf",
  "psutil",
  "pydantic-core",
  "sqlalchemy",
]

[tool.ruff]
extend = "../ruff-shared.toml"

[tool.pytest.ini_options]
pythonpath = [ "src" ]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--tb=short",
  "-p no:sugar",
  "-q",
  "-ra",
  "--timeout=30",
  "--timeout-method=signal",
  "--durations=0",
]
markers = [
  "e2e: End-to-end tests",
  "integration: Integration tests",
  "slow: Slow tests",
  "smoke: Smoke tests",
  "unit: Unit tests",
]
minversion = "8.0"
testpaths = [
  "tests",
]

[tool.poetry.dependencies.flext-core]
develop = true
path = "../flext-core"

[tool.poetry.dependencies.flext-observability]
develop = true
path = "../flext-observability"

[tool.ruff.lint.isort]
known-first-party = [
  "flext_grpc",
]

[tool.pyrefly]
search-path = [ "../typings", "../typings/generated", "src", "tests", "examples", "scripts" ]

# BoundMethod/Protocol structural subtyping: pyrefly is strict;
# classmethods and instance methods used as factory/handler callables
# are structurally compatible but not recognized
project-excludes = [ "**/*_pb2*.py", "**/*_pb2_grpc*.py" ]
[[tool.pyrefly.sub-config]]
matches = "**/flext_grpc/api.py"
[tool.pyrefly.sub-config.errors]
bad-assignment = false
bad-return = false
unsupported-operation = false

[tool.coverage]
[tool.coverage.run]
source = [ "src/flext_grpc" ]

[tool.coverage.report]
fail_under = 100
precision = 2

[tool.bandit]
skips = [
  "B404",
  "B603",
  "B607",
  "B105",
  "B608",
]

[dependency-groups]
dev = [
]
